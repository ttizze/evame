name: iPhone editor

on:
  pull_request:
    paths:
      - "apps/ios/**"
      - "src/app/*/_components/editor/**"
      - "src/app/*/_domain/get-x-post-id.ts"
      - "package.json"
      - "bun.lock"
      - "scripts/ios.sh"
      - "flake.*"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - "src/app/*/_components/editor/**"
      - "src/app/*/_domain/get-x-post-id.ts"
      - "package.json"
      - "bun.lock"
      - "scripts/ios.sh"
      - "flake.*"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command bash scripts/ios.sh test 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5'
      - run: git diff --exit-code -- apps/ios/Sources/EditorCore/Resources apps/ios/App/Resources/LexicalModel.js apps/ios/App/Resources/LexicalModel-LICENSES.txt apps/ios/Tests/EditorCoreTests/Fixtures/Upstream/ProseMirrorTests.js

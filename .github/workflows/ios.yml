name: iPhone editor

on:
  pull_request:
    paths:
      - "patches/**"
      - "tests/editor-matrix.mjs"
      - "apps/ios/**"
      - "src/app/*/_components/editor/**"
      - "src/app/*/_domain/get-x-post-id.ts"
      - "package.json"
      - "bun.lock"
      - "scripts/ios.sh"
      - "scripts/ios-test-shard.*"
      - "flake.*"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "patches/**"
      - "tests/editor-matrix.mjs"
      - "apps/ios/**"
      - "src/app/*/_components/editor/**"
      - "src/app/*/_domain/get-x-post-id.ts"
      - "package.json"
      - "bun.lock"
      - "scripts/ios.sh"
      - "scripts/ios-test-shard.*"
      - "flake.*"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command bash scripts/ios.sh build-for-testing 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5'
      - run: git diff --exit-code -- apps/ios/Sources/EditorCore/Resources apps/ios/App/Resources/LexicalModel.js apps/ios/App/Resources/LexicalModel-LICENSES.txt apps/ios/Tests/EditorCoreTests/Fixtures/Upstream/ProseMirrorTests.js
      - name: Archive test products with executable permissions
        run: tar -C apps/ios/DerivedData/Build -cf "$RUNNER_TEMP/ios-tests.tar" Products
      - uses: actions/upload-artifact@v7
        with:
          name: ios-tests
          path: ${{ runner.temp }}/ios-tests.tar
          if-no-files-found: error
          compression-level: 1
          overwrite: true
          retention-days: 7

  test:
    needs: build
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: native
          - suite: ui
            shard: 0
          - suite: ui
            shard: 1
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SUITE: ${{ matrix.suite }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - uses: actions/download-artifact@v8
        with:
          name: ios-tests
          path: ${{ runner.temp }}
      - run: |
          mkdir -p apps/ios/DerivedData/Build
          tar -C apps/ios/DerivedData/Build -xf "$RUNNER_TEMP/ios-tests.tar"
      - name: Run the prebuilt tests
        run: |
          if [[ "$SUITE" == native ]]; then
            nix develop --command bash scripts/ios.sh test-without-building 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' -only-testing:NativeTests
          else
            nix develop --command bash scripts/ios.sh test-ui-shard 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' "$SHARD" 2
          fi

  editor:
    needs: [build, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$BUILD_RESULT" = success && test "$TEST_RESULT" = success

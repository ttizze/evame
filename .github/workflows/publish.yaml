name: Publish
run-name: Publish CI ${{ github.event.workflow_run.id }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.event == 'pull_request' && 'evame-publish-preview' || 'evame-publish-production') || format('evame-publish-skip-{0}', github.run_id) }}
  queue: max

jobs:
  revision:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      url: ${{ steps.revision.outputs.url }}
      pr: ${{ steps.revision.outputs.pr }}
      attempt: ${{ steps.revision.outputs.attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve verified Preview revision
        id: revision
        uses: actions/github-script@v8
        with:
          script: |
            const { pathToFileURL } = require("node:url");
            const { verifiedPublication, confirmPublication, confirmPreviewApproval, previewOrigin } =
              await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/cloudflare-build.mjs`).href);
            const run = context.payload.workflow_run;
            const publication = verifiedPublication(run);
            if (!publication) return;
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const get = async path => (await github.request(`GET /repos/${repository}/${path}`)).data;
            const username = await confirmPublication(publication, run.head_branch, run.head_sha, get);
            if (publication.pr) {
              await confirmPreviewApproval(run.id, run.run_attempt, get);
              const { data: { permission } } = await github.rest.repos.getCollaboratorPermissionLevel({ ...context.repo, username });
              if (!["write", "maintain", "admin"].includes(permission)) return;
              const { data: commit } = await github.rest.repos.getCommit({ ...context.repo, ref: publication.sha });
              if (commit.parents.map(parent => parent.sha).join(" ") !== `${publication.pr.base} ${run.head_sha}`)
                throw new Error("CI did not verify the PR merge revision");
              core.setOutput("pr", String(publication.pr.number));
              core.setOutput("url", previewOrigin(publication.pr.number));
            }
            core.setOutput("sha", publication.sha);
            core.setOutput("attempt", process.env.GITHUB_RUN_ATTEMPT);

  migrate:
    needs: revision
    if: needs.revision.outputs.pr != ''
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ needs.revision.outputs.url }}
    outputs:
      attempt: ${{ steps.migration.outputs.attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.revision.outputs.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix develop --command bun install --frozen-lockfile
      - name: Confirm the verified revision is still current
        uses: actions/github-script@v8
        with:
          script: |
            const { pathToFileURL } = require("node:url");
            const { verifiedPublication, confirmPublication } =
              await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/cloudflare-build.mjs`).href);
            const run = context.payload.workflow_run;
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const get = async path => (await github.request(`GET /repos/${repository}/${path}`)).data;
            const publication = verifiedPublication(run);
            await confirmPublication(publication, run.head_branch, run.head_sha, get);
      - name: Migrate preview database
        id: migration
        env:
          PR_NUMBER: ${{ needs.revision.outputs.pr }}
          EVAME_PREVIEW_SECRETS: ${{ secrets.EVAME_PREVIEW_SECRETS }}
        run: |
          nix develop --command bun run preview:workers migrate
          printf 'attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  signal:
    needs: [revision, migrate]
    if: ${{ !cancelled() && needs.revision.result == 'success' && needs.revision.outputs.sha != '' && (needs.revision.outputs.pr == '' || needs.migrate.result == 'success') }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.signal.outputs.sha }}
    permissions:
      contents: write
    steps:
      - name: Signal Cloudflare Workers Builds
        id: signal
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ needs.revision.outputs.pr }}
          PUBLISH_PROOF_ATTEMPT: ${{ needs.revision.outputs.pr != '' && needs.migrate.outputs.attempt || needs.revision.outputs.attempt }}
        with:
          script: |
            const { id: ciRunId, run_number: ciRunNumber, run_attempt: ciRunAttempt, head_branch: sourceBranch, head_sha: sourceSha } = context.payload.workflow_run;
            const publishRunAttempt = Number(process.env.PUBLISH_PROOF_ATTEMPT);
            if (![ciRunId, ciRunNumber, ciRunAttempt, publishRunAttempt].every(value => Number.isSafeInteger(value) && value > 0))
              throw new Error("Invalid publication run or attempt");
            const pr = process.env.PR_NUMBER;
            if (pr && !/^[1-9]\d*$/.test(pr)) throw new Error("Invalid Preview PR number");
            const ref = `heads/cf-publish/${pr ? `pr-${pr}` : "main"}`;
            let parents = [];
            try {
              const { data: previous } = await github.rest.git.getRef({ ...context.repo, ref });
              parents = [previous.object.sha];
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (parents.length) {
              const { data: previous } = await github.rest.git.getCommit({ ...context.repo, commit_sha: parents[0] });
              const { ciRunNumber: previousRun, ciRunAttempt: previousAttempt } = JSON.parse(previous.message);
              if (![previousRun, previousAttempt].every(value => Number.isSafeInteger(value) && value > 0))
                throw new Error("Invalid current publication signal");
              if (ciRunNumber < previousRun || (ciRunNumber === previousRun && ciRunAttempt < previousAttempt)) {
                core.notice("A newer CI result has already signaled publication");
                return;
              }
            }
            const { data: tree } = await github.rest.git.createTree({ ...context.repo, tree: [
              { path: "wrangler.jsonc", mode: "100644", type: "blob", content: '{"name":"evame-start"}\n' },
            ] });
            const message = JSON.stringify({ ciRunId, ciRunNumber, ciRunAttempt, publishRunId: context.runId, publishRunAttempt });
            const { data: commit } = await github.rest.git.createCommit({ ...context.repo, message, tree: tree.sha, parents });
            const { data: source } = await github.rest.git.getRef({ ...context.repo, ref: `heads/${sourceBranch}` });
            if (source.object.sha !== sourceSha) throw new Error("Source branch changed before publication");
            if (parents.length) await github.rest.git.updateRef({ ...context.repo, ref, sha: commit.sha, force: false });
            else await github.rest.git.createRef({ ...context.repo, ref: `refs/${ref}`, sha: commit.sha });
            core.setOutput("sha", commit.sha);

  production:
    needs: [revision, signal]
    if: needs.revision.outputs.pr == '' && needs.signal.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 26
    permissions:
      checks: read
    steps:
      - name: Wait for Cloudflare production deployment
        uses: actions/github-script@v8
        env:
          SIGNAL_SHA: ${{ needs.signal.outputs.sha }}
        with:
          script: |
            const { setTimeout } = require("node:timers/promises");
            const deadline = Date.now() + 24 * 60_000;
            while (Date.now() < deadline) {
              const { data } = await github.rest.checks.listForRef({ ...context.repo, ref: process.env.SIGNAL_SHA });
              const check = data.check_runs.find(({ app, name }) => app?.slug === "cloudflare-workers-and-pages" && name === "Workers Builds: evame-start");
              if (check?.status === "completed") {
                if (check.conclusion === "success") return;
                throw new Error(`Cloudflare production deployment ${check.conclusion}: ${check.details_url}`);
              }
              await setTimeout(15000);
            }
            throw new Error("Cloudflare production deployment was not confirmed");

  preview:
    needs: [revision, signal]
    if: needs.revision.outputs.pr != '' && needs.signal.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: preview
      url: ${{ needs.revision.outputs.url }}
    env:
      SENTRY_DSN: ""
      VITE_SENTRY_DSN: ""
      CONNECTED_PREVIEW_ORIGIN: ${{ needs.revision.outputs.url }}
      CONNECTED_PREVIEW_SIGNAL: ${{ needs.signal.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.revision.outputs.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: nix develop --command bun install --frozen-lockfile
      - name: Wait for Cloudflare to publish the verified revision
        run: |
          nix develop --command node --input-type=module - <<'JS'
          import { setTimeout } from 'node:timers/promises';
          import { assertPreviewSignal, previewSignalHeader, readPreviewSignal } from './scripts/preview-deployment.mjs';
          const { CONNECTED_PREVIEW_ORIGIN: origin, CONNECTED_PREVIEW_SIGNAL: signal } = process.env;
          const deadline = Date.now() + 18 * 60_000;
          while (await readPreviewSignal(origin, signal) !== signal) {
            if (Date.now() >= deadline) throw new Error(`Cloudflare did not publish verified Preview signal ${signal}`);
            await setTimeout(15000);
          }
          for (const path of ['/api/auth/get-session', '/ja']) {
            const response = await fetch(`${origin}${path}`, { headers: { [previewSignalHeader]: signal }, signal: AbortSignal.timeout(15000) });
            await response.body?.cancel();
            assertPreviewSignal(signal, response.headers.get(previewSignalHeader));
            if (response.status !== 200 || (path === '/ja' && response.headers.get('x-evame-html') !== 'astro'))
              throw new Error(`Preview verification failed: ${path} (HTTP ${response.status})`);
          }
          JS
      - name: Verify connected publication on Cloudflare Preview
        env:
          EVAME_PREVIEW_SECRETS: ${{ secrets.EVAME_PREVIEW_SECRETS }}
          EVAME_CONNECTED_BROWSER: "true"
        run: |
          nix develop --command docker run --rm --init --ipc=host \
            --volume "$PWD:$PWD" --volume /nix/store:/nix/store:ro \
            --workdir "$PWD" --user "$(id -u):$(id -g)" \
            --env PATH --env GSETTINGS_SCHEMA_DIR --env SENTRY_DSN --env VITE_SENTRY_DSN \
            --env EVAME_PREVIEW_SECRETS --env CONNECTED_PREVIEW_ORIGIN --env CONNECTED_PREVIEW_SIGNAL \
            --env EVAME_CONNECTED_BROWSER \
            mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 \
            node scripts/check-reader-connected.mjs
      - name: Upload connected publication verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: connected-publication
          include-hidden-files: true
          path: |
            .data/reader-connected-*/result.json
            .data/reader-connected-*/*.png
          if-no-files-found: error
          retention-days: 7

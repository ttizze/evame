name: Publish
run-name: Publish CI ${{ github.event.workflow_run.id }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  revision:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      url: ${{ steps.revision.outputs.url }}
      pr: ${{ steps.revision.outputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve verified Preview revision
        id: revision
        uses: actions/github-script@v8
        with:
          script: |
            const { pathToFileURL } = require("node:url");
            const { verifiedPublication, confirmPublication, confirmPreviewApproval, previewOrigin } =
              await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/cloudflare-build.mjs`).href);
            const run = context.payload.workflow_run;
            const publication = verifiedPublication(run);
            if (!publication) return;
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const get = async path => (await github.request(`GET /repos/${repository}/${path}`)).data;
            const username = await confirmPublication(publication, run.head_branch, run.head_sha, get);
            if (publication.pr) {
              await confirmPreviewApproval(publication.pr.runId, get);
              const { data: { permission } } = await github.rest.repos.getCollaboratorPermissionLevel({ ...context.repo, username });
              if (!["write", "maintain", "admin"].includes(permission)) return;
              const { data: commit } = await github.rest.repos.getCommit({ ...context.repo, ref: publication.sha });
              if (commit.parents.map(parent => parent.sha).join(" ") !== `${publication.pr.base} ${run.head_sha}`)
                throw new Error("CI did not verify the PR merge revision");
              core.setOutput("pr", String(publication.pr.number));
              core.setOutput("url", previewOrigin(publication.pr.number));
            }
            core.setOutput("sha", publication.sha);

  migrate:
    needs: revision
    if: needs.revision.outputs.sha != ''
    runs-on: ubuntu-latest
    concurrency:
      group: evame-db-${{ needs.revision.outputs.pr != '' && 'preview' || 'production' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.revision.outputs.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix develop --command bun install --frozen-lockfile
      - name: Confirm the verified revision is still current
        uses: actions/github-script@v8
        with:
          script: |
            const { pathToFileURL } = require("node:url");
            const { verifiedPublication, confirmPublication } =
              await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/cloudflare-build.mjs`).href);
            const run = context.payload.workflow_run;
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const get = async path => (await github.request(`GET /repos/${repository}/${path}`)).data;
            const publication = verifiedPublication(run);
            await confirmPublication(publication, run.head_branch, run.head_sha, get);
      - name: Migrate production database
        if: needs.revision.outputs.pr == ''
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: nix develop --command bun run db:prod:migrate
      - name: Migrate preview database
        if: needs.revision.outputs.pr != ''
        env:
          PR_NUMBER: ${{ needs.revision.outputs.pr }}
          EVAME_PREVIEW_SECRETS: ${{ secrets.EVAME_PREVIEW_SECRETS }}
        run: nix develop --command bun run preview:workers migrate

  signal:
    needs: [revision, migrate]
    runs-on: ubuntu-latest
    concurrency:
      group: evame-publish-${{ needs.revision.outputs.pr || 'main' }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Signal Cloudflare Workers Builds
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ needs.revision.outputs.pr }}
        with:
          script: |
            const { id: ciRunId, head_branch: sourceBranch, head_sha: sourceSha } = context.payload.workflow_run;
            const pr = process.env.PR_NUMBER;
            if (pr && !/^[1-9]\d*$/.test(pr)) throw new Error("Invalid Preview PR number");
            const ref = `heads/cf-publish/${pr ? `pr-${pr}` : "main"}`;
            let parents = [];
            try {
              const { data: previous } = await github.rest.git.getRef({ ...context.repo, ref });
              parents = [previous.object.sha];
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const { data: tree } = await github.rest.git.createTree({ ...context.repo, tree: [
              { path: "wrangler.jsonc", mode: "100644", type: "blob", content: '{"name":"evame-start"}\n' },
            ] });
            const message = JSON.stringify({ ciRunId, publishRunId: context.runId });
            const { data: commit } = await github.rest.git.createCommit({ ...context.repo, message, tree: tree.sha, parents });
            const { data: source } = await github.rest.git.getRef({ ...context.repo, ref: `heads/${sourceBranch}` });
            if (source.object.sha !== sourceSha) throw new Error("Source branch changed before publication");
            if (parents.length) await github.rest.git.updateRef({ ...context.repo, ref, sha: commit.sha, force: false });
            else await github.rest.git.createRef({ ...context.repo, ref: `refs/${ref}`, sha: commit.sha });

  preview:
    needs: [revision, signal]
    if: needs.revision.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: preview
      url: ${{ needs.revision.outputs.url }}
    concurrency:
      group: evame-preview-connected
      cancel-in-progress: false
    env:
      SENTRY_DSN: ""
      VITE_SENTRY_DSN: ""
      CONNECTED_PREVIEW_ORIGIN: ${{ needs.revision.outputs.url }}
      CONNECTED_PREVIEW_SHA: ${{ needs.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.revision.outputs.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: nix develop --command bun install --frozen-lockfile
      - name: Wait for Cloudflare to publish the verified revision
        run: |
          nix develop --command node --input-type=module - <<'JS'
          import { setTimeout } from 'node:timers/promises';
          const { CONNECTED_PREVIEW_ORIGIN: origin, CONNECTED_PREVIEW_SHA: sha } = process.env;
          const deadline = Date.now() + 18 * 60_000;
          for (;;) {
            const revision = await fetch(`${origin}/evame-preview-commit.txt?sha=${sha}`, { signal: AbortSignal.timeout(15000) }).catch(() => null);
            if (revision?.ok && (await revision.text()).trim() === sha) break;
            if (revision && !revision.bodyUsed) await revision.body?.cancel();
            if (Date.now() >= deadline) throw new Error(`Cloudflare did not publish verified Preview revision ${sha}`);
            await setTimeout(15000);
          }
          for (const path of ['/api/auth/get-session', '/ja']) {
            const response = await fetch(`${origin}${path}`, { signal: AbortSignal.timeout(15000) });
            await response.body?.cancel();
            if (response.status !== 200 || (path === '/ja' && response.headers.get('x-evame-html') !== 'astro'))
              throw new Error(`Preview verification failed: ${path} (HTTP ${response.status})`);
          }
          JS
      - name: Verify connected publication on Cloudflare Preview
        env:
          EVAME_PREVIEW_SECRETS: ${{ secrets.EVAME_PREVIEW_SECRETS }}
          EVAME_CONNECTED_BROWSER: "true"
        run: |
          nix develop --command docker run --rm --init --ipc=host \
            --volume "$PWD:$PWD" --volume /nix/store:/nix/store:ro \
            --workdir "$PWD" --user "$(id -u):$(id -g)" \
            --env PATH --env GSETTINGS_SCHEMA_DIR --env SENTRY_DSN --env VITE_SENTRY_DSN \
            --env EVAME_PREVIEW_SECRETS --env CONNECTED_PREVIEW_ORIGIN \
            --env EVAME_CONNECTED_BROWSER \
            mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 \
            node scripts/check-reader-connected.mjs
      - name: Upload connected publication verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: connected-publication
          include-hidden-files: true
          path: |
            .data/reader-connected-*/result.json
            .data/reader-connected-*/*.png
          if-no-files-found: error
          retention-days: 7

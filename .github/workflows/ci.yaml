name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-check:
    runs-on: ubuntu-latest
    env:
      TURSO_DATABASE_URL: file:evame.db
      GOOGLE_ANALYTICS_ID: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.GOOGLE_ANALYTICS_ID || 'G-0000000000' }}
      TZ: Asia/Tokyo
      SENTRY_DSN: ""
      VITE_SENTRY_DSN: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          nix develop --command bun install --frozen-lockfile

      - name: Run Biome
        run: |
          nix develop --command bun x biome ci .

      - name: Run Typecheck
        run: |
          nix develop --command bun run typecheck
          nix develop --command bun run check:reader

      - name: Run Tests
        run: |
          nix develop --command bun run db:prod:migrate
          nix develop --command bun run db:prod:seed
          nix develop --command bun run test --run

      - name: Migrate production database
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: nix develop --command bun run db:prod:migrate

      - name: Build Astro and TanStack Start for Cloudflare Workers
        env:
          TURSO_DATABASE_URL: ""
          TURSO_AUTH_TOKEN: ""
          SENTRY_AUTH_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.SENTRY_AUTH_TOKEN || '' }}
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" && "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            nix develop --command env -u SENTRY_DSN -u VITE_SENTRY_DSN bun run build
          else
            nix develop --command bun run build
          fi

      - name: Restore published Reader assets
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/restore@v5
        with:
          path: .data/reader-assets
          key: reader-assets-v2-${{ runner.os }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: reader-assets-v2-${{ runner.os }}-

      - name: Verify private Reader publication access
        if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: nix develop --command node scripts/generate-reader-html.mjs --check-access

      - name: Retain published Reader assets
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: nix develop --command bun run prepare:reader-assets

      - name: Install Chromium for browser regression checks
        run: nix develop --command bun x playwright install --with-deps chromium

      - name: Verify isolated deployment runtime and browser behavior
        run: nix develop --command bun run test:deployment:browser

      - name: Deploy Cloudflare Workers
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: nix develop --command bun run deploy:workers

      - name: Save published Reader assets
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && hashFiles('.data/reader-assets/active.json') != ''
        uses: actions/cache/save@v5
        with:
          path: .data/reader-assets
          key: reader-assets-v2-${{ runner.os }}-${{ github.sha }}-${{ github.run_attempt }}

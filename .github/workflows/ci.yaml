name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      TURSO_DATABASE_URL: file:evame.db
      TZ: Asia/Tokyo
      SENTRY_DSN: ""
      VITE_SENTRY_DSN: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          nix develop --command bun install --frozen-lockfile

      - name: Run Biome
        run: |
          nix develop --command bun x biome ci .

      - name: Run Typecheck
        run: |
          nix develop --command bun run typecheck
          nix develop --command bun run check:reader

      - name: Run Tests
        run: |
          nix develop --command bun run db:prod:migrate
          nix develop --command bun run db:prod:seed
          nix develop --command bun run test --run

  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_ANALYTICS_ID: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.GOOGLE_ANALYTICS_ID || 'G-0000000000' }}
      TZ: Asia/Tokyo
      SENTRY_DSN: ""
      VITE_SENTRY_DSN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix develop --command bun install --frozen-lockfile
      - name: Build Astro and TanStack Start for Cloudflare Workers
        env:
          TURSO_DATABASE_URL: ""
          TURSO_AUTH_TOKEN: ""
          SENTRY_AUTH_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.SENTRY_AUTH_TOKEN || '' }}
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" && "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            nix develop --command env -u SENTRY_DSN -u VITE_SENTRY_DSN bun run build
          else
            nix develop --command bun run build
          fi

      - name: Archive Workers build
        run: tar --exclude='.dev.vars*' --exclude='.env*' -cf "$RUNNER_TEMP/workers.tar" dist reader/dist
      - uses: actions/upload-artifact@v7
        with:
          name: workers
          path: ${{ runner.temp }}/workers.tar
          if-no-files-found: error
          compression-level: 1
          overwrite: true
          retention-days: 7

  browser:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        suite:
          - editor-drag
          - editor-lists-clipboard
          - editor-lists-structure
          - editor-lists-formatting
        include:
          - suite: reader
            browser: chromium
    env:
      SENTRY_DSN: ""
      VITE_SENTRY_DSN: ""
      TZ: Asia/Tokyo
      EVAME_BROWSER_SUITE: ${{ matrix.suite }}
      EVAME_BROWSER_TYPE: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix develop --command bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: workers
          path: ${{ runner.temp }}
      - run: tar -xf "$RUNNER_TEMP/workers.tar"
      - name: Run prebuilt browsers with the Nix toolchain
        run: |
          nix develop --command docker run --rm --init --ipc=host \
            --volume "$PWD:$PWD" --volume /nix/store:/nix/store:ro \
            --workdir "$PWD" \
            --env PATH --env GSETTINGS_SCHEMA_DIR --env TZ \
            --env SENTRY_DSN --env VITE_SENTRY_DSN --env EVAME_BROWSER_SUITE --env EVAME_BROWSER_TYPE \
            mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 \
            bun run test:deployment:browser

  ci-check:
    needs: [checks, build, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every check and browser suite to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$CHECKS_RESULT" = success && test "$BUILD_RESULT" = success && test "$BROWSER_RESULT" = success
      - uses: actions/checkout@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: nix develop --command bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: workers
          path: ${{ runner.temp }}
      - name: Restore verified Workers build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: tar -xf "$RUNNER_TEMP/workers.tar"
      - name: Migrate production database
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: nix develop --command bun run db:prod:migrate

      - name: Restore published Reader assets
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/restore@v5
        with:
          path: .data/reader-assets
          key: reader-assets-v2-${{ runner.os }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: reader-assets-v2-${{ runner.os }}-

      - name: Retain published Reader assets
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: nix develop --command bun run prepare:reader-assets

      - name: Deploy Cloudflare Workers
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: nix develop --command bun run deploy:workers

      - name: Save published Reader assets
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && hashFiles('.data/reader-assets/active.json') != ''
        uses: actions/cache/save@v5
        with:
          path: .data/reader-assets
          key: reader-assets-v2-${{ runner.os }}-${{ github.sha }}-${{ github.run_attempt }}

  preview:
    needs: ci-check
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: evame-preview
      cancel-in-progress: false
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      deployments: write
    env:
      PR_NUMBER: ${{ github.event.number }}
      SENTRY_DSN: ""
      VITE_SENTRY_DSN: ""
      GOOGLE_ANALYTICS_ID: G-0000000000
      VITE_AUTH_GOOGLE_ENABLED: "false"
      VITE_PUBLIC_DOMAIN: https://pr-${{ github.event.number }}-evame-start.reimei.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: nix develop --command bun install --frozen-lockfile
      - name: Build PR preview
        run: nix develop --command bun run build
      - name: Deploy native Cloudflare Previews
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EVAME_PREVIEW_SECRETS: ${{ secrets.EVAME_PREVIEW_SECRETS }}
        run: nix develop --command bun run preview:workers
      - name: Verify preview auth and Reader
        run: |
          # shellcheck disable=SC2016 # テンプレート展開はBunが行う。
          nix develop --command bun -e '
            for (const path of ["/api/auth/get-session", "/ja"]) {
              const response = await fetch(process.env.VITE_PUBLIC_DOMAIN + path, { signal: AbortSignal.timeout(30000) });
              if (response.status !== 200 || (path === "/ja" && response.headers.get("x-evame-html") !== "dynamic")) {
                throw new Error(`Preview verification failed: ${path} (HTTP ${response.status})`);
              }
              await response.body?.cancel();
            }
          '

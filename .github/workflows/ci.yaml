name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  ci-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome
        run: bun x @biomejs/biome ci .

      - name: Typecheck
        run: bun run typecheck

      - name: Run Tests
        env:
          TZ: 'Asia/Tokyo'
        run: bun run test -- --run

      - name: Build
        run: bun run build

      - name: Validate Cloudflare Worker bundle
        run: bunx wrangler deploy --dry-run

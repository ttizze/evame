name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  ci-check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@db.localtest.me:5435/main
      TZ: Asia/Tokyo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start test database
        run: |
          docker compose up -d --wait test_neon

      - name: Install dependencies
        run: |
          nix develop --command bun install --frozen-lockfile

      - name: Run Biome
        run: |
          nix develop --command bun x biome ci .

      - name: Run Typecheck
        run: nix develop --command bun run typecheck

      - name: Run Tests
        run: |
          nix develop --command bun run db:prod:migrate
          nix develop --command bun run db:prod:seed
          nix develop --command bun run test --run

      - name: Build TanStack Start for Cloudflare Workers
        env:
          SENTRY_DSN: ""
          VITE_SENTRY_DSN: ""
        run: nix develop --command bun run build

      - name: Verify isolated deployment runtime
        run: nix develop --command bun run test:deployment

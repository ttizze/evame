name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@db.localtest.me:5435/main
      TZ: Asia/Tokyo
      SENTRY_DSN: ""
      VITE_SENTRY_DSN: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start test database
        run: |
          docker compose up -d --wait test_neon

      - name: Install dependencies
        run: |
          nix develop --command bun install --frozen-lockfile

      - name: Run Biome
        run: |
          nix develop --command bun x biome ci .

      - name: Run Typecheck
        run: nix develop --command bun run typecheck

      - name: Run Tests
        run: |
          nix develop --command bun run db:prod:migrate
          nix develop --command bun run db:prod:seed
          nix develop --command bun run test --run

      - name: Build TanStack Start for Cloudflare Workers
        env:
          SENTRY_AUTH_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.SENTRY_AUTH_TOKEN || '' }}
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" && "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            nix develop --command env -u SENTRY_DSN -u VITE_SENTRY_DSN bun run build
          else
            nix develop --command bun run build
          fi

      - name: Verify isolated deployment runtime
        run: nix develop --command bun run test:deployment

      - name: Migrate production database and deploy Cloudflare Workers
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          nix develop --command bun run db:prod:migrate
          nix develop --command bun x wrangler deploy

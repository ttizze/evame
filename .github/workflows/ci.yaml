name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      SENTRY_DSN: ""
      VITE_SENTRY_DSN: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          nix develop --command bun install --frozen-lockfile

      - name: Run Biome
        run: |
          nix develop --command bun x biome ci .

      - name: Run Typecheck
        run: |
          nix develop --command bun run typecheck
          nix develop --command bun run check:reader

      - name: Run Tests
        run: |
          nix develop --command bun run test --run

  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_ANALYTICS_ID: G-0000000000
      TZ: Asia/Tokyo
      SENTRY_DSN: ""
      VITE_SENTRY_DSN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix develop --command bun install --frozen-lockfile
      - name: Build Astro and TanStack Start for Cloudflare Workers
        env:
          TURSO_DATABASE_URL: ""
          TURSO_AUTH_TOKEN: ""
          SENTRY_AUTH_TOKEN: ""
        run: nix develop --command bun run build

      - name: Prepare browser test SQLite
        run: nix develop --command node scripts/test-database.mjs .data/browser-test.db
      - name: Archive Workers build
        run: tar --exclude='.dev.vars*' --exclude='.env*' -cf "$RUNNER_TEMP/workers.tar" dist .data/browser-test.db
      - name: Verify saving and public HTML in one Worker
        env:
          EVAME_TEST_DATABASE_TEMPLATE: .data/browser-test.db
        run: nix develop --command node scripts/check-reader-connected.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: workers
          path: ${{ runner.temp }}/workers.tar
          if-no-files-found: error
          compression-level: 1
          overwrite: true
          retention-days: 7

      - name: Record verified source revision
        run: git rev-parse HEAD > "$RUNNER_TEMP/source.sha"
      - uses: actions/upload-artifact@v7
        with:
          name: verified-source
          path: ${{ runner.temp }}/source.sha
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  browser:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        suite:
          - editor-drag
          - editor-lists-clipboard
          - editor-lists-structure
          - editor-lists-formatting
        include:
          - suite: reader
            browser: chromium
    env:
      SENTRY_DSN: ""
      VITE_SENTRY_DSN: ""
      TZ: Asia/Tokyo
      EVAME_TEST_DATABASE_TEMPLATE: .data/browser-test.db
      EVAME_BROWSER_SUITE: ${{ matrix.suite }}
      EVAME_BROWSER_TYPE: ${{ matrix.browser }}
      DEBUG: pw:browser
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix develop --command bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: workers
          path: ${{ runner.temp }}
      - run: tar -xf "$RUNNER_TEMP/workers.tar"
      - name: Run prebuilt browsers with the Nix toolchain
        run: |
          nix develop --command docker run --rm --init --ipc=host \
            --volume "$PWD:$PWD" --volume /nix/store:/nix/store:ro \
            --workdir "$PWD" --user "$(id -u):$(id -g)" \
            --env PATH --env GSETTINGS_SCHEMA_DIR --env TZ \
            --env SENTRY_DSN --env VITE_SENTRY_DSN --env EVAME_BROWSER_SUITE --env EVAME_BROWSER_TYPE \
            --env EVAME_TEST_DATABASE_TEMPLATE --env DEBUG \
            mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 \
            bun run test:deployment:browser
      - name: Upload browser failure traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-traces-${{ matrix.suite }}-${{ matrix.browser }}
          path: .data/header-browser
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  ci-check:
    needs: [checks, build, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every check and browser suite to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$CHECKS_RESULT" = success && test "$BUILD_RESULT" = success && test "$BROWSER_RESULT" = success

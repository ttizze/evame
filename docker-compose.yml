services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  mc:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb -p myminio/evame || true;
      mc anonymous set public myminio/evame;
      tail -f /dev/null
      "

  qstash:
    image: public.ecr.aws/upstash/qstash:latest
    command: ["qstash", "dev"]
    ports:
      - "8080:8080"
    # Ensure the container can resolve the host machine as host.docker.internal
    # so it can deliver webhooks to the TanStack Start server at http://host.docker.internal:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  redis:
    driver: local
  minio_data:
    driver: local

name: EvameEditorPrototype
options:
  developmentLanguage: ja
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "4"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
packages:
  EvameEditor:
    path: .
targets:
  EvameEditorPrototype:
    type: application
    platform: iOS
    sources:
      - App
      - path: Tests/EditorCoreTests/Fixtures/round-trip.md
        buildPhase: resources
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: app.evame.editor-prototype
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Evame
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: EvameEditor
        product: EditorCore
  NativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NativeTests
      - Tests/EditorCoreTests/ProseMirrorTests.swift
      - Tests/EditorCoreTests/BackspaceEditingTests.swift
      - path: Tests/EditorCoreTests/Fixtures/Upstream/ProseMirrorTests.js
        buildPhase: resources
      - path: Tests/EditorCoreTests/Fixtures/Upstream/prosemirror-cases.json
        buildPhase: resources
    dependencies:
      - target: EvameEditorPrototype
  EditorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: EvameEditorPrototype
schemes:
  EvameEditorPrototype:
    build:
      targets:
        EvameEditorPrototype: all
    test:
      targets: [NativeTests, EditorUITests]
